services:
  client:
    image: ${DOCKERHUB_USERNAME}/linguaquest-client:${CLIENT_IMAGE_TAG:-latest}
    container_name: linguaquest-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - linguaquest-network

  server:
    image: ${DOCKERHUB_USERNAME}/linguaquest-server:${SERVER_IMAGE_TAG:-latest}
    container_name: linguaquest-server
    restart: unless-stopped
    environment:
      APP_EDITION: ${APP_EDITION:-COMMERCIAL}
      PORT: "8177"
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADDR: ${REDIS_ADDR:-linguaquest-redis:6379}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SQLITE_PATH: ${SQLITE_PATH:-}
      MIGRATIONS_DIR: migrations
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://43.172.5.210:3000/v1}
      TTS_PROVIDER: ${TTS_PROVIDER:-XIAOMI}
      TTS_API_URL: ${TTS_API_URL:-https://api.xiaomimimo.com/v1}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-mimo_default}
      TTS_MODEL: ${TTS_MODEL:-mimo-v2.5-tts}
      TTS_AUDIO_FORMAT: ${TTS_AUDIO_FORMAT:-mp3}
      TTS_MAX_CONCURRENCY: ${TTS_MAX_CONCURRENCY:-2}
      MEDIA_DIR: ${MEDIA_DIR:-/srv/media}
      TTS_USE_UPLOAD_PROMPT: ${TTS_USE_UPLOAD_PROMPT:-false}
      TTS_PROMPT_AUDIO_PATH: ${TTS_PROMPT_AUDIO_PATH:-~/autodl-tmp/CosyVoice/test/test.225.wav}
      TTS_RETURN_JSON: ${TTS_RETURN_JSON:-true}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-300}
      TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-1}
      ASR_PROVIDER: ${ASR_PROVIDER:-XIAOMI}
      ASR_API_URL: ${ASR_API_URL:-https://api.xiaomimimo.com/v1}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_APP_ID: ${ASR_APP_ID:-}
      ASR_MODEL: ${ASR_MODEL:-mimo-v2.5-asr}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-30}
      BACKGROUND_TASK_TIMEOUT_SECONDS: ${BACKGROUND_TASK_TIMEOUT_SECONDS:-1200}
      HTTP_RATE_LIMIT_PER_MINUTE: ${HTTP_RATE_LIMIT_PER_MINUTE:-180}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-12}
      AI_REQUEST_RATE_LIMIT_PER_MINUTE: ${AI_REQUEST_RATE_LIMIT_PER_MINUTE:-20}
      GRAPHQL_MAX_BODY_BYTES: ${GRAPHQL_MAX_BODY_BYTES:-16777216}
      MEDIA_PROXY_MAX_BYTES: ${MEDIA_PROXY_MAX_BYTES:-20971520}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Asia/Shanghai}
      ANALYTICS_ADMIN_TOKEN: ${ANALYTICS_ADMIN_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_FREE_DAILY_CREDITS: ${BILLING_FREE_DAILY_CREDITS:-20}
      MINI_AD_FREE_DAILY_USES: ${MINI_AD_FREE_DAILY_USES:-3}
      MINI_PROGRAM_DAILY_AI_USES: ${MINI_PROGRAM_DAILY_AI_USES:-20}
      MINI_PROGRAM_AI_COOLDOWN_SECONDS: ${MINI_PROGRAM_AI_COOLDOWN_SECONDS:-12}
      MINI_PROGRAM_MAX_ACTIVE_TASKS: ${MINI_PROGRAM_MAX_ACTIVE_TASKS:-2}
      BILLING_TIMEZONE: ${BILLING_TIMEZONE:-Asia/Shanghai}
      EPAY_GATEWAY_URL: ${EPAY_GATEWAY_URL:-}
      EPAY_MERCHANT_ID: ${EPAY_MERCHANT_ID:-}
      EPAY_KEY: ${EPAY_KEY:-}
      EPAY_NOTIFY_URL: ${EPAY_NOTIFY_URL:-}
      EPAY_DEFAULT_CHANNEL: ${EPAY_DEFAULT_CHANNEL:-wxpay}
      EPAY_SIGNATURE_MODE: ${EPAY_SIGNATURE_MODE:-RAW_KEY}
      AD_PROVIDER: ${AD_PROVIDER:-MOCK}
      AD_SCRIPT_URL: ${AD_SCRIPT_URL:-}
      AD_COURSE_SLOT: ${AD_COURSE_SLOT:-}
      AD_LIBRARY_SLOT: ${AD_LIBRARY_SLOT:-}
      AD_RESULT_SLOT: ${AD_RESULT_SLOT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - server-media:/srv/media
      - server-data:/srv/data
    networks:
      - linguaquest-network

volumes:
  server-data:
  server-media:

networks:
  linguaquest-network:
    external: true
