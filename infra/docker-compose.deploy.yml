services:
  client:
    image: ${DOCKERHUB_USERNAME}/linguaquest-client:${CLIENT_IMAGE_TAG:-latest}
    container_name: linguaquest-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    image: ${DOCKERHUB_USERNAME}/linguaquest-server:${SERVER_IMAGE_TAG:-latest}
    container_name: linguaquest-server
    restart: unless-stopped
    environment:
      PORT: "8177"
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADDR: redis:6379
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      MIGRATIONS_DIR: migrations
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://43.172.5.210:3000/v1}
      TTS_PROVIDER: ${TTS_PROVIDER:-XIAOMI}
      TTS_API_URL: ${TTS_API_URL:-https://api.xiaomimimo.com/v1}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-mimo_default}
      TTS_MODEL: ${TTS_MODEL:-mimo-v2.5-tts}
      TTS_AUDIO_FORMAT: ${TTS_AUDIO_FORMAT:-wav}
      TTS_USE_UPLOAD_PROMPT: ${TTS_USE_UPLOAD_PROMPT:-false}
      TTS_PROMPT_AUDIO_PATH: ${TTS_PROMPT_AUDIO_PATH:-~/autodl-tmp/CosyVoice/test/test.225.wav}
      TTS_RETURN_JSON: ${TTS_RETURN_JSON:-true}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-300}
      TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    container_name: linguaquest-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: linguaquest-rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  redis-data:
  rabbitmq-data:
