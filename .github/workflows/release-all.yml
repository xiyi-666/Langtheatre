name: release-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: tauri-linux
          - os: windows-latest
            platform: windows
            artifact_name: tauri-windows
          - os: macos-latest
            platform: macos
            artifact_name: tauri-macos
    env:
      VITE_API_URL: http://61.244.24.7/graphql
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        working-directory: apps/client
        run: npx tauri icon src-tauri/icons/app-icon.svg

      - name: Build Linux bundle
        if: matrix.platform == 'linux'
        working-directory: apps/client
        run: npx tauri build --bundles appimage,deb

      - name: Build Windows bundle
        if: matrix.platform == 'windows'
        working-directory: apps/client
        run: npx tauri build --bundles nsis

      - name: Build macOS bundle
        if: matrix.platform == 'macos'
        run: npm run tauri:build --workspace apps/client

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/client/src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_URL: http://61.244.24.7/graphql
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        working-directory: apps/client
        run: npx tauri icon src-tauri/icons/app-icon.svg

      - name: Init Android project
        working-directory: apps/client
        run: npx tauri android init --ci

      - name: Configure Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        working-directory: apps/client
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          storeFile=$RUNNER_TEMP/release.keystore
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\nimport java.util.Properties\n\n" + text

          signing_block = """signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }

                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          """

          if 'create("release")' not in text:
              text = text.replace("buildTypes {", signing_block + "buildTypes {", 1)

          release_block = """getByName("release") {
                      signingConfig = signingConfigs.getByName("release")"""

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace('getByName("release") {', release_block, 1)

          path.write_text(text)
          PY

      - name: Build Android package
        shell: bash
        working-directory: apps/client
        run: |
          set -euo pipefail
          MODE="--debug"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            MODE=""
          fi

          npx tauri android build --apk $MODE

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android
          path: apps/client/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

  docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Docker metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-client
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/client
          file: ./apps/client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/graphql
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

  release:
    runs-on: ubuntu-latest
    needs: [desktop, android, docker-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" -y || true

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux
          path: release-assets/tauri-linux

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows
          path: release-assets/tauri-windows

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-macos
          path: release-assets/tauri-macos

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: tauri-android
          path: release-assets/android

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p release-assets/filtered

          find release-assets/tauri-linux -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -print0 \
            | xargs -0 -r -I {} cp "{}" release-assets/filtered/

          find release-assets/tauri-windows -type f \( -name "*setup*.exe" -o -name "*.msi" \) -print0 \
            | xargs -0 -r -I {} cp "{}" release-assets/filtered/

          find release-assets/tauri-macos -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.zip" \) -print0 \
            | xargs -0 -r -I {} cp "{}" release-assets/filtered/

          find release-assets/android -type f -name "*.apk" -print0 \
            | xargs -0 -r -I {} cp "{}" "release-assets/filtered/LinguaQuest-android-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LinguaQuest ${GITHUB_REF_NAME}"
          body: |
            Release: ${GITHUB_REF_NAME}

            Default API endpoint:
            - http://61.244.24.7/graphql

            Assets:
            - Linux (.AppImage / .deb)
            - Windows setup (.exe / .msi)
            - macOS (.dmg / app archive)
            - Android (.apk)
          files: |
            release-assets/filtered/**
