name: release-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for manual release assets. Use latest for the moving latest package set, or vX.Y.Z for a fixed release."
        required: true
        default: "latest"
      create_release:
        description: "Create or update a GitHub Release from the selected ref."
        required: true
        type: boolean
        default: true
      publish_docker_latest:
        description: "Also tag Docker images as latest from the selected ref."
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: tauri-linux
          - os: windows-latest
            platform: windows
            artifact_name: tauri-windows
          - os: macos-latest
            platform: macos
            artifact_name: tauri-macos
    env:
      VITE_API_URL: ${{ secrets.DESKTOP_API_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_APP_EDITION: MINI_PROGRAM
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        working-directory: apps/client
        run: npx tauri icon src-tauri/icons/app-icon.svg

      - name: Build Linux bundle
        if: matrix.platform == 'linux'
        working-directory: apps/client
        run: npm run tauri:validate-api-url && npx tauri build --bundles appimage,deb

      - name: Build Windows bundle
        if: matrix.platform == 'windows'
        working-directory: apps/client
        run: npm run tauri:validate-api-url && npx tauri build --bundles nsis

      - name: Build macOS bundle
        if: matrix.platform == 'macos'
        run: npm run tauri:build --workspace apps/client

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/client/src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_URL: ${{ secrets.DESKTOP_API_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_APP_EDITION: MINI_PROGRAM
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icons
        working-directory: apps/client
        run: npx tauri icon src-tauri/icons/app-icon.svg

      - name: Init Android project
        working-directory: apps/client
        run: npx tauri android init --ci

      - name: Configure Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        working-directory: apps/client
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          storeFile=$RUNNER_TEMP/release.keystore
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\nimport java.util.Properties\n\n" + text

          signing_block = """signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }

                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          """

          if 'create("release")' not in text:
              text = text.replace("buildTypes {", signing_block + "buildTypes {", 1)

          release_block = """getByName("release") {
                      signingConfig = signingConfigs.getByName("release")"""

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace('getByName("release") {', release_block, 1)

          path.write_text(text)
          PY

      - name: Build Android package
        shell: bash
        working-directory: apps/client
        run: |
          set -euo pipefail
          MODE="--debug"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            MODE=""
          fi

          npx tauri android build --apk $MODE

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android
          path: apps/client/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

  docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-server
          tags: |
            type=raw,value=mini-program
            type=sha,format=short,prefix=mini-
            type=ref,event=tag,prefix=mini-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          cache-from: type=gha,scope=linguaquest-server
          cache-to: type=gha,mode=max,scope=linguaquest-server
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Docker metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-client
          tags: |
            type=raw,value=mini-program
            type=sha,format=short,prefix=mini-
            type=ref,event=tag,prefix=mini-

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          build-args: |
            VITE_API_URL=/graphql
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_APP_EDITION=MINI_PROGRAM
          cache-from: type=gha,scope=linguaquest-client
          cache-to: type=gha,mode=max,scope=linguaquest-client
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

  release:
    runs-on: ubuntu-latest
    needs: [desktop, android, docker-images]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    env:
      RELEASE_TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || 'latest' }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move latest tag to this commit
        if: env.RELEASE_TAG_NAME == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG_NAME" --force

      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$RELEASE_TAG_NAME" -y || true

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux
          path: release-assets/tauri-linux

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows
          path: release-assets/tauri-windows

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: tauri-macos
          path: release-assets/tauri-macos

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: tauri-android
          path: release-assets/android

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${RELEASE_TAG_NAME}"
          mkdir -p release-assets/filtered

          find release-assets/tauri-linux -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -print0 \
            | xargs -0 -r -I {} cp "{}" release-assets/filtered/

          find release-assets/tauri-windows -type f \( -name "*setup*.exe" -o -name "*.msi" \) -print0 \
            | xargs -0 -r -I {} cp "{}" release-assets/filtered/

          find release-assets/tauri-macos -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.zip" \) -print0 \
            | xargs -0 -r -I {} cp "{}" release-assets/filtered/

          find release-assets/android -type f -name "*.apk" -print0 \
            | xargs -0 -r -I {} cp "{}" "release-assets/filtered/LinguaQuest-android-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: "LinguaQuest ${{ env.RELEASE_TAG_NAME }}"
          body: |
            Release: ${{ env.RELEASE_TAG_NAME }}

            API endpoint:
            - Configured from the DESKTOP_API_URL repository secret (HTTPS required).

            Assets:
            - Linux (.AppImage / .deb)
            - Windows setup (.exe / .msi)
            - macOS (.dmg / app archive)
            - Android (.apk)
          files: |
            release-assets/filtered/**
