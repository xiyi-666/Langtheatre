name: dockerhub-manual

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Tag Docker images as latest from the selected ref."
        required: true
        type: boolean
        default: true

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-server
          tags: |
            type=raw,value=mini-program
            type=sha,format=short,prefix=mini-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          cache-from: type=gha,scope=linguaquest-server
          cache-to: type=gha,mode=max,scope=linguaquest-server
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Docker metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-client
          tags: |
            type=raw,value=mini-program
            type=sha,format=short,prefix=mini-

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          build-args: |
            VITE_API_URL=/graphql
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=linguaquest-client
          cache-to: type=gha,mode=max,scope=linguaquest-client
            VITE_APP_EDITION=MINI_PROGRAM
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
