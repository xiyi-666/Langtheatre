name: publish-mini-program-images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - apps/server/**
      - infra/docker-compose.deploy.yml
      - .github/workflows/deploy.yml

concurrency:
  group: mini-program-image-publish
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Mini Program client
        run: |
          npm ci
          npm run lint --workspace apps/client
          npm run typecheck --workspace apps/client
          npm run build:mini-program --workspace apps/client

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Verify server
        working-directory: apps/server
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod download
          # Keep SQLite-heavy tests deterministic on a cold GitHub-hosted runner.
          export GOMAXPROCS=2
          run_checked() {
            local label="$1"
            local log_file="/tmp/${label//[^a-zA-Z0-9_-]/_}.log"
            shift
            set +e
            "$@" 2>&1 | tee "$log_file"
            local status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -ne 0 ]]; then
              local summary
              summary=$(grep -E '(^--- FAIL:|^FAIL($|[[:space:]])|^panic:|^fatal error:|^    .*(Error|expected|got|want|missing|should))' "$log_file" | tail -n 40 || true)
              if [[ -z "$summary" ]]; then
                summary=$(tail -n 80 "$log_file")
              fi
              summary=$(printf '%s' "$summary" | tr '\r\n' '  ' | sed 's/%/%25/g' | cut -c1-4000)
              echo "::error file=.github/workflows/deploy.yml,line=54::$label failed: $summary"
              return "$status"
            fi
          }
          run_checked server-tests go test -p=1 -parallel=1 -count=1 -timeout=12m ./... -cover
          run_checked server-build go build -v -p=1 -mod=mod -trimpath -o /tmp/linguaquest-api ./cmd/server

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: [quality-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (Mini Program server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-server
          tags: |
            type=raw,value=mini-program
            type=sha,format=short,prefix=mini-

      - name: Build and push Mini Program server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          cache-from: type=gha,scope=linguaquest-server
          cache-to: type=gha,mode=max,scope=linguaquest-server
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Docker metadata (Mini Program client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-client
          tags: |
            type=raw,value=mini-program
            type=sha,format=short,prefix=mini-

      - name: Build and push Mini Program client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          build-args: |
            VITE_API_URL=/graphql
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_APP_EDITION=MINI_PROGRAM
          cache-from: type=gha,scope=linguaquest-client
          cache-to: type=gha,mode=max,scope=linguaquest-client
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
