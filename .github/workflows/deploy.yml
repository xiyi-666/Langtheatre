name: deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_HOST: 61.244.24.7
  DEPLOY_DIR: /opt/linguaquest
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Tag Docker images as latest from the selected ref before deploying."
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - apps/client/**
      - apps/server/**
      - infra/docker-compose.deploy.yml
      - .github/workflows/deploy.yml

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.publish_latest == 'true' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          cache-from: type=gha,scope=linguaquest-server
          cache-to: type=gha,mode=max,scope=linguaquest-server
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Docker metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/linguaquest-client
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.publish_latest == 'true' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          build-args: |
            VITE_API_URL=/graphql
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=linguaquest-client
          cache-to: type=gha,mode=max,scope=linguaquest-client
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

  prepare-deploy-bundle:
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          cp infra/docker-compose.deploy.yml .deploy/docker-compose.deploy.yml
          cat > .deploy/.env.production <<EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          CLIENT_IMAGE_TAG=sha-${GITHUB_SHA::7}
          SERVER_IMAGE_TAG=sha-${GITHUB_SHA::7}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL=${{ vars.OPENAI_BASE_URL }}
          TTS_PROVIDER=${{ vars.TTS_PROVIDER }}
          TTS_API_URL=${{ vars.TTS_API_URL }}
          TTS_API_KEY=${{ secrets.TTS_API_KEY }}
          TTS_VOICE=${{ vars.TTS_VOICE }}
          TTS_MODEL=${{ vars.TTS_MODEL }}
          TTS_AUDIO_FORMAT=${{ vars.TTS_AUDIO_FORMAT }}
          TTS_USE_UPLOAD_PROMPT=${{ vars.TTS_USE_UPLOAD_PROMPT }}
          TTS_PROMPT_AUDIO_PATH=${{ vars.TTS_PROMPT_AUDIO_PATH }}
          TTS_RETURN_JSON=${{ vars.TTS_RETURN_JSON }}
          TTS_TIMEOUT_SECONDS=${{ vars.TTS_TIMEOUT_SECONDS }}
          TTS_MAX_RETRIES=${{ vars.TTS_MAX_RETRIES }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF
          docker compose --env-file .deploy/.env.production -f .deploy/docker-compose.deploy.yml config > .deploy/docker-compose.rendered.yml

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          include-hidden-files: true
          path: |
            .deploy/.env.production
            .deploy/docker-compose.deploy.yml
            .deploy/docker-compose.rendered.yml

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: [prepare-deploy-bundle]
    permissions:
      contents: read
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: .deploy

      - name: Skip remote deploy when SSH secrets are missing
        if: ${{ env.DEPLOY_USER == '' || env.DEPLOY_SSH_KEY == '' }}
        run: echo "DEPLOY_USER or DEPLOY_SSH_KEY is not configured, skipping remote deployment."

      - name: Upload deploy files to server
        if: ${{ env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          source: ".deploy/.env.production,.deploy/docker-compose.deploy.yml"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Pull and restart containers
        if: ${{ env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose --env-file .env.production -f docker-compose.deploy.yml pull
            docker compose --env-file .env.production -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
